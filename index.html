<!DOCTYPE html>

    <script>
        tailwind.config = {

    <style>
        /* Mobile App Container Simulation */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Card Swipe Styles */
        .card-stack {
            position: relative;
            width: 100%;
            height: 420px;
        }

        .swipe-card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, opacity 0.2s ease;
            cursor: grab;
            will-change: transform;
            touch-action: pan-y;
        }

        .swipe-card.dragging {
            transition: none;
            cursor: grabbing;
        }

        /* Stamp Indicators on Swipe */
        .badge-stamp {
            position: absolute;
            top: 20px;
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 0.15s ease;
            pointer-events: none;
            z-index: 10;
        }

        .badge-yes {
            right: 20px;
            border: 3px solid #DC2626;
            color: #DC2626;
            transform: rotate(12deg);
        }

        .badge-no {
            left: 20px;
            border: 3px solid #16A34A;
            color: #16A34A;
            transform: rotate(-12deg);
        }

        /* Custom Scrollbar for App Feel */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F5F9;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 3px;
        }
    </style>
</head>

    <!-- Main Mobile Container -->

        <!-- App Header -->

        <!-- Dynamic Content Body -->

        </main>

        <!-- Footer Navigation / Controls -->
        <footer id="app-footer" class="bg-white border-t border-slate-200 px-4 py-3 shrink-0 flex justify-between items-center shadow-lg">
            <!-- Dynamic footer buttons will be injected here -->
        </footer>
    </div>

    <!-- Info Modal / Popup -->
    <div id="info-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-slate-200 animate-in fade-in zoom-in duration-200">

                <i class="fa-solid fa-circle-info text-2xl"></i>

            </div>
            <div id="modal-content" class="text-sm text-slate-600 space-y-2 mb-6">

        // App State
        let appState = {
            currentStep: 1,
            metadata: {
                companyName: "Arbeitsschutz Wolf",
                siteName: "",
                inspector: "",
                date: new Date().toISOString().split('T')[0],
                logo: null,
                logoDimensions: null,
                signature: null
            },
            swipeIndex: 0,
            assessments: {}
        };

        // Helper date calculator
        function getCalculatedDate(option, customDate = null) {
            const today = new Date();
            if (option === 'ERLEDIGT') {
                return `Erledigt am ${today.toLocaleDateString('de-DE')}`;
            } else if (option === 'IN_ARBEIT') {
                const target = new Date();
                target.setDate(today.getDate() + 7);
                return `In Arbeit (Ziel: ${target.toLocaleDateString('de-DE')})`;
            } else if (option === 'IN_PROZESS') {
                if (customDate) {
                    const cDate = new Date(customDate);
                    return `In Prozess (Ziel: ${cDate.toLocaleDateString('de-DE')})`;
                }
                const target = new Date();
                target.setMonth(today.getMonth() + 1);
                return `In Prozess (Ziel: ${target.toLocaleDateString('de-DE')})`;
            }
            return '';
        }

        window.onload = function() {
            renderApp();
        };

        function renderApp() {
            const body = document.getElementById('app-body');
            const footer = document.getElementById('app-footer');
            const stepInd = document.getElementById('step-indicator');

            stepInd.innerText = `${appState.currentStep} / 4`;

            switch(appState.currentStep) {
                case 1:
                    renderStepStammdaten(body, footer);
                    break;
                case 2:
                    renderStepSwipe(body, footer);
                    break;
                case 3:
                    renderStepDetails(body, footer);
                    break;
                case 4:
                    renderStepSummary(body, footer);
                    break;
            }
        }

            const companyInput = document.getElementById('input-company');
            const siteInput = document.getElementById('input-site');
            const inspectorInput = document.getElementById('input-inspector');
            const dateInput = document.getElementById('input-date');

            if (siteInput) appState.metadata.siteName = siteInput.value;

                        photo: null
                    }] : []

            } else {
                appState.assessments[currentCat.id].present = hasDanger;
                if (hasDanger && appState.assessments[currentCat.id].items.length === 0) {

        function initSwipeGestures() {
            const card = document.getElementById('active-swipe-card');
            if (!card) return;

            let startX = 0, currentX = 0, isDragging = false;
            const yesBadge = card.querySelector('.badge-yes');
            const noBadge = card.querySelector('.badge-no');

            const startDrag = (e) => {
                isDragging = true;
                startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                card.classList.add('dragging');
            };

            const moveDrag = (e) => {
                if (!isDragging) return;
                currentX = (e.type.includes('touch') ? e.touches[0].clientX : e.clientX) - startX;
                card.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.05}deg)`;

                if (currentX > 30) {
                    yesBadge.style.opacity = Math.min(currentX / 100, 1);
                    noBadge.style.opacity = 0;
                } else if (currentX < -30) {
                    noBadge.style.opacity = Math.min(-currentX / 100, 1);
                    yesBadge.style.opacity = 0;
                } else {
                    yesBadge.style.opacity = 0;
                    noBadge.style.opacity = 0;
                }
            };

            const endDrag = () => {
                if (!isDragging) return;
                isDragging = false;
                card.classList.remove('dragging');

                if (currentX > 100) {
                    swipeDecision(true);
                } else if (currentX < -100) {
                    swipeDecision(false);
                } else {
                    card.style.transform = 'none';
                    if (yesBadge) yesBadge.style.opacity = 0;
                    if (noBadge) noBadge.style.opacity = 0;
                }
            };

            card.addEventListener('mousedown', startDrag);
            window.addEventListener('mousemove', moveDrag);
            window.addEventListener('mouseup', endDrag);

            card.addEventListener('touchstart', startDrag);
            window.addEventListener('touchmove', moveDrag);
            window.addEventListener('touchend', endDrag);
        }

                                <div>
                                    <strong class="font-bold block text-amber-950">🟡 GELB (${yellowCount}x Achtung): Gefahrenstelle umgehen / beheben!</strong>
                                    <p class="mt-0.5 text-[11px]">Achtung geboten! Gefahrenstelle sichern, nach TOP-Prinzip anpassen und Maßnahmen im angegebenen Zeitraum durchführen.</p>
                                </div>
                            </div>
                        ` : ''}

                        ${(totalHazards === 0 || (redCount === 0 && yellowCount === 0)) ? `
                            <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-xs text-emerald-800 flex items-start gap-2.5">
                                <i class="fa-solid fa-circle-check text-emerald-600 text-lg mt-0.5"></i>
                                <div>
                                    <strong class="font-bold block text-emerald-900">🟢 GRÜN: Alles in Ordnung</strong>
                                    <p class="mt-0.5 text-[11px]">Keine kritischen Mängel festgestellt. Der reguläre Baustellenbetrieb kann fortgesetzt werden.</p>
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                        <div class="flex justify-between items-center">
                            <label class="text-xs font-bold text-slate-700 uppercase">Digitale Unterschrift des Prüfers</label>
                            <button onclick="clearSignature()" class="text-[10px] text-red-500 font-bold hover:underline">
                                <i class="fa-solid fa-eraser mr-1"></i> Löschen
                            </button>
                        </div>
                        <div class="border border-slate-300 rounded-xl overflow-hidden bg-slate-50 relative">
                            <canvas id="signature-canvas" class="w-full h-32 touch-none cursor-crosshair"></canvas>
                        </div>
                    </div>
                </div>
            `;

            footer.innerHTML = `
                <button onclick="appState.currentStep = 3; renderApp();" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-3 px-4 rounded-xl text-xs">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Zurück
                </button>
                <button onclick="generatePDF()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3.5 px-6 rounded-xl text-xs flex items-center gap-2 shadow-lg active:scale-95 transition-all">
                    <i class="fa-solid fa-file-pdf text-lg"></i>
                    <span>PDF Herunterladen</span>
                </button>
            `;

            setTimeout(initSignatureCanvas, 100);
        }

        let signaturePadCanvas = null, signatureCtx = null, isSigning = false;

        function initSignatureCanvas() {
            const canvas = document.getElementById('signature-canvas');
            if (!canvas) return;

            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            signatureCtx = canvas.getContext('2d');
            signatureCtx.strokeStyle = "#0F172A";
            signatureCtx.lineWidth = 2.5;
            signatureCtx.lineCap = "round";

            const getPos = (e) => {
                const cRect = canvas.getBoundingClientRect();
                return {
                    x: (e.touches ? e.touches[0].clientX : e.clientX) - cRect.left,
                    y: (e.touches ? e.touches[0].clientY : e.clientY) - cRect.top
                };
            };

            const startSign = (e) => {
                isSigning = true;
                const pos = getPos(e);
                signatureCtx.beginPath();
                signatureCtx.moveTo(pos.x, pos.y);
            };

            const moveSign = (e) => {
                if (!isSigning) return;
                const pos = getPos(e);
                signatureCtx.lineTo(pos.x, pos.y);
                signatureCtx.stroke();
            };

            const endSign = () => {
                if (!isSigning) return;
                isSigning = false;
                appState.metadata.signature = canvas.toDataURL('image/png');
            };

            canvas.addEventListener('mousedown', startSign);
            canvas.addEventListener('mousemove', moveSign);
            window.addEventListener('mouseup', endSign);

            canvas.addEventListener('touchstart', startSign);
            canvas.addEventListener('touchmove', moveSign);
            window.addEventListener('touchend', endSign);
        }

        function clearSignature() {
            const canvas = document.getElementById('signature-canvas');
            if (canvas && signatureCtx) {
                signatureCtx.clearRect(0, 0, canvas.width, canvas.height);
                appState.metadata.signature = null;
            }
        }

        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });

            const pageHeight = 297;
            const pageWidth = 210;
            const margin = 15;
            let currentY = 15;

            const checkPageBreak = (neededHeight) => {
                if (currentY + neededHeight > pageHeight - 20) {
                    doc.setFontSize(8);
                    doc.setTextColor(150, 150, 150);
                    doc.text("Copyright Arbeitsschutz Wolf", margin, pageHeight - 10);
                    doc.addPage();
                    currentY = 15;
                }
            };

            const headerHeight = 24;
            doc.setFillColor(30, 41, 59);
            doc.rect(0, 0, pageWidth, headerHeight, 'F');

            doc.setFillColor(245, 158, 11);
            doc.rect(0, headerHeight - 1.5, pageWidth, 1.5, 'F');

            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.setTextColor(255, 255, 255);
            doc.text("GEFÄHRDUNGSBEURTEILUNG BAUSTELLE", margin, 11);
            
            doc.setFontSize(9);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(245, 158, 11);
            doc.text(appState.metadata.companyName || "Arbeitsschutz Wolf", margin, 17);

            if (appState.metadata.logo && appState.metadata.logoDimensions) {
                try {
                    const maxLogoW = 35;
                    const maxLogoH = 16;
                    let logoW = maxLogoW;
                    let logoH = (appState.metadata.logoDimensions.height / appState.metadata.logoDimensions.width) * logoW;

                    if (logoH > maxLogoH) {
                        logoH = maxLogoH;
                        logoW = (appState.metadata.logoDimensions.width / appState.metadata.logoDimensions.height) * logoH;
                    }
                    doc.addImage(appState.metadata.logo, 'JPEG', pageWidth - margin - logoW, 4, logoW, logoH);
                } catch(e) {}
            }

            currentY = headerHeight + 8;

            doc.setFillColor(248, 250, 252);
            doc.rect(margin, currentY, pageWidth - (margin * 2), 22, 'F');
            doc.setFontSize(9);
            doc.setTextColor(51, 65, 85);

            doc.setFont("helvetica", "bold");
            doc.text("Baustelle / Objekt:", margin + 4, currentY + 6);
            doc.text("Prüfer / Verantwortlicher:", margin + 4, currentY + 12);
            doc.text("Datum:", margin + 4, currentY + 18);

            doc.setFont("helvetica", "normal");
            doc.text(appState.metadata.siteName || "-", margin + 45, currentY + 6);
            doc.text(appState.metadata.inspector || "-", margin + 45, currentY + 12);
            doc.text(appState.metadata.date || "-", margin + 45, currentY + 18);

            currentY += 28;

            const photosToAppend = [];

            bghmCategories.forEach(cat => {
                const assessment = appState.assessments[cat.id];
                const hasHazards = assessment && assessment.present && assessment.items.length > 0;

                checkPageBreak(25);

                doc.setFillColor(241, 245, 249);
                doc.rect(margin, currentY, pageWidth - (margin * 2), 7, 'F');
                doc.setFont("helvetica", "bold");
                doc.setFontSize(10);
                doc.setTextColor(30, 41, 59);
                doc.text(cat.title, margin + 3, currentY + 5);
                currentY += 10;

                if (!hasHazards) {
                    doc.setFont("helvetica", "normal");
                    doc.setFontSize(8.5);
                    doc.setTextColor(22, 163, 74);
                    doc.text("GRÜN (OK) - Keine Gefährdung auf der Baustelle festgestellt.", margin + 3, currentY);
                    currentY += 8;
                } else {
                    assessment.items.forEach((item, idx) => {
                        checkPageBreak(35);

                        if (item.photo) {
                            photosToAppend.push({
                                categoryTitle: cat.title,
                                itemIndex: idx + 1,
                                description: item.description || "Mangel ohne Text",
                                photoData: item.photo
                            });
                        }

                        const leftColW = 115;
                        const rightColX = margin + leftColW + 5;

                        doc.setFont("helvetica", "bold");
                        doc.setFontSize(9);
                        doc.setTextColor(217, 119, 6);
                        doc.text(`Mangel #${idx + 1}: ${item.description || "Unbenannter Mangel"}`, margin + 3, currentY);

                        doc.setFontSize(8);
                        doc.setFont("helvetica", "bold");
                        if (item.riskLevel === 'ROT') doc.setTextColor(220, 38, 38);
                        else if (item.riskLevel === 'GELB') doc.setTextColor(217, 119, 6);
                        else doc.setTextColor(22, 163, 74);

                        doc.text(`Status: ${item.riskLevel || 'GELB'}`, rightColX, currentY);

                        doc.setFont("helvetica", "normal");
                        doc.setTextColor(71, 85, 105);
                        doc.text(`Verantwortlich: ${item.responsible || 'Nicht zugewiesen'}`, rightColX, currentY + 4);
                        doc.text(`Frist: ${item.priority || 'MITTEL'}`, rightColX, currentY + 8);

                        currentY += 5;

                        doc.setFontSize(8);
                        doc.setTextColor(30, 41, 59);

                        const topData = [
                            { label: "T (Soll):", val: item.topT_soll, ist: item.topT_ist },
                            { label: "O (Soll):", val: item.topO_soll, ist: item.topO_ist },
                            { label: "P (Soll):", val: item.topP_soll, ist: item.topP_ist }
                        ];

                        topData.forEach(top => {
                            if (top.val) {
                                const lines = doc.splitTextToSize(`${top.label} ${top.val}`, leftColW - 5);
                                doc.text(lines, margin + 5, currentY);
                                currentY += (lines.length * 4);
                            }
                            if (top.ist) {
                                const linesIst = doc.splitTextToSize(`(Ist): ${top.ist}`, leftColW - 5);
                                doc.setTextColor(100, 116, 139);
                                doc.text(linesIst, margin + 8, currentY);
                                doc.setTextColor(30, 41, 59);
                                currentY += (linesIst.length * 4);
                            }
                        });

                        currentY += 4;
                    });
                }
            });

            checkPageBreak(35);
            currentY += 10;
            doc.setFontSize(9);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(30, 41, 59);
            doc.text("Unterschrift Prüfer:", margin, currentY);

            if (appState.metadata.signature) {
                try {
                    doc.addImage(appState.metadata.signature, 'PNG', margin, currentY + 2, 50, 20);
                } catch(e) {}
            }

            doc.text(`Datum: ${appState.metadata.date}`, margin + 110, currentY);

            if (photosToAppend.length > 0) {
                doc.addPage();
                currentY = 15;

                doc.setFont("helvetica", "bold");
                doc.setFontSize(14);
                doc.setTextColor(30, 41, 59);
                doc.text("ANHANG: FOTODOKUMENTATION DER GEFÄHRDUNGEN", margin, currentY);
                currentY += 12;

                photosToAppend.forEach((photoObj) => {
                    checkPageBreak(75);

                    doc.setFontSize(10);
                    doc.setFont("helvetica", "bold");
                    doc.setTextColor(217, 119, 6);
                    doc.text(`${photoObj.categoryTitle} - Mangel #${photoObj.itemIndex}`, margin, currentY);

                    doc.setFontSize(9);
                    doc.setFont("helvetica", "normal");
                    doc.setTextColor(51, 65, 85);
                    doc.text(`Befund: ${photoObj.description}`, margin, currentY + 5);

                    try {
                        doc.addImage(photoObj.photoData, 'JPEG', margin, currentY + 9, 80, 55);
                    } catch (e) {
                        try {
                            doc.addImage(photoObj.photoData, 'PNG', margin, currentY + 9, 80, 55);
                        } catch(err) {}
                    }

                    currentY += 70;
                });
            }

            const totalPages = doc.internal.getNumberOfPages();
            for (let i = 1; i <= totalPages; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.setTextColor(148, 163, 184);
                doc.text("Copyright Arbeitsschutz Wolf", margin, pageHeight - 10);
            }

            doc.save(`Gefahrungsbeurteilung_${appState.metadata.siteName.replace(/\s+/g, '_') || 'Baustelle'}.pdf`);
        }
    </script>
</body>
